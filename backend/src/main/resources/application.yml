spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/fasthire}
    username: ${DB_USER:fasthire}
    password: ${DB_PASSWORD:fasthire}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

fasthire:
  profile-path: ${PROFILE_PATH:../profile.yml}
  sources-path: ${SOURCES_PATH:sources.xlsx}
  scoring:
    threshold: 70
  schedule:
    cron: "0 0 7 * * *"
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
