server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/fasthire}
    username: ${DB_USER:fasthire}
    password: ${DB_PASSWORD:fasthire}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

fasthire:
  profile-path: ${PROFILE_PATH:../profile.yml}
  sources-path: ${SOURCES_PATH:sources.xlsx}
  scoring:
    threshold: ${SCORING_THRESHOLD:70}
  schedule:
    cron: "0 0 7 * * *"
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:993}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    folder: ${MAIL_FOLDER:INBOX}
    lookback-days: ${MAIL_LOOKBACK_DAYS:3}
  alerts:
    fallback-region: ${ALERTS_FALLBACK_REGION:UAE}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
